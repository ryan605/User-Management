
<div class="login-container">
  <div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Please login to your account</p>

    <form [formGroup]="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input formControlName="Email" type="email" id="email" name="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input formControlName="Password" type="password" id="password" name="password" placeholder="Enter your password" />
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" name="remember" />
          Remember me
        </label>

        <a href="#">Forgot password?</a>
      </div>

      <button (click)="onLogin()" type="submit">Login</button>

      <p class="signup-text">
        Don't have an account?
        <a href="#">Sign up</a>
      </p>
    </form>
  </div>
</div>
